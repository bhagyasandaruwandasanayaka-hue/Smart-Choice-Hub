<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | S U P I R I</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        primary: '#0ea5e9', secondary: '#8b5cf6',
                        dark: '#0f172a', darker: '#020617', glass: 'rgba(255, 255, 255, 0.05)',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-panel { @apply bg-glass backdrop-blur-lg border border-white/10 shadow-xl; }
            .text-gradient { @apply bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary; }
            .btn-primary { @apply px-8 py-3 rounded-full bg-gradient-to-r from-primary to-secondary text-white font-bold hover:shadow-lg hover:shadow-primary/50 transition-all duration-300 transform hover:-translate-y-1; }
        }
    </style>
</head>

<body class="bg-darker text-slate-200 font-sans antialiased">
    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-darker/80 backdrop-blur-md border-b border-white/5">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold tracking-tighter hover:opacity-80">S U P I R I <span
                    class="text-primary">.</span></a>
            <div class="hidden md:flex gap-8 items-center">
                <a href="index.html" class="hover:text-primary transition-colors font-medium">Home</a>
                <a href="shop.html" class="hover:text-primary transition-colors font-medium">Shop</a>
                <a href="contact.html" class="hover:text-primary transition-colors font-medium">Contact</a>
            </div>
            <div class="flex items-center gap-6">
                <!-- Mobile Menu Button -->
                <button id="mobile-menu-btn" class="md:hidden text-white hover:text-primary"><svg
                        xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg></button>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div id="mobile-menu"
            class="hidden md:hidden glass-panel border-b border-white/5 absolute w-full top-full left-0 bg-darker">
            <div class="container mx-auto px-6 py-4 flex flex-col gap-4">
                <a href="index.html" class="block w-full py-2 hover:text-primary">Home</a>
                <a href="shop.html" class="block w-full py-2 hover:text-primary">Shop</a>
                <a href="contact.html" class="block w-full py-2 hover:text-primary">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Cart Header -->
    <header class="pt-32 pb-8 bg-darker">
        <div class="container mx-auto px-6 text-center">
            <h1 class="text-3xl md:text-5xl font-bold mb-2">Shopping <span class="text-gradient">Cart</span></h1>
        </div>
    </header>

    <!-- Cart Content -->
    <section class="pb-24">
        <div class="container mx-auto px-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
                <!-- Cart Items List -->
                <div class="lg:col-span-2 space-y-4" id="cart-items-container">
                    <!-- Javascript will populate this -->
                </div>

                <!-- Checkout Summary -->
                <div class="lg:col-span-1">
                    <div class="glass-panel p-8 rounded-2xl sticky top-24">
                        <h3 class="text-xl font-bold mb-6">Order Summary</h3>

                        <div class="space-y-4 mb-6 pb-6 border-b border-white/10">
                            <div class="flex justify-between text-slate-400">
                                <span>Subtotal</span>
                                <span id="cart-total" class="text-white font-bold">LKR 0</span>
                            </div>
                            <div class="flex justify-between text-slate-400">
                                <span>Shipping</span>
                                <span class="text-primary text-sm font-semibold">Free</span>
                            </div>
                        </div>

                        <div class="flex justify-between items-center mb-8 text-xl font-bold">
                            <span>Total</span>
                            <span id="cart-final-total"></span>
                            <!-- Helper JS calculates this, but reusing #cart-total essentially -->
                        </div>

                        <button onclick="alert('Checkout feature coming soon!')"
                            class="w-full btn-primary py-4 text-center block">
                            Proceed to Checkout
                        </button>

                        <p class="mt-4 text-xs text-center text-slate-500">
                            Secure checkout powered by Stripe.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-12 border-t border-white/5 bg-darker">
        <div class="container mx-auto px-6 text-center text-slate-500 text-sm">
            <p>&copy; 2024 Supiri Store. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="assets/js/items.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
