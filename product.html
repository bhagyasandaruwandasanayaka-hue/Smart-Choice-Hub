<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | S U P I R I</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        primary: '#0ea5e9', secondary: '#8b5cf6',
                        dark: '#0f172a', darker: '#020617', glass: 'rgba(255, 255, 255, 0.05)',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-panel { @apply bg-glass backdrop-blur-lg border border-white/10 shadow-xl; }
            .text-gradient { @apply bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary; }
            .btn-primary { @apply px-8 py-3 rounded-full bg-gradient-to-r from-primary to-secondary text-white font-bold hover:shadow-lg hover:shadow-primary/50 transition-all duration-300 transform hover:-translate-y-1; }
        }
    </style>
</head>

<body class="bg-darker text-slate-200 font-sans antialiased">
    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-darker/80 backdrop-blur-md border-b border-white/5">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold tracking-tighter hover:opacity-80">S U P I R I <span
                    class="text-primary">.</span></a>
            <div class="hidden md:flex gap-8 items-center">
                <a href="index.html" class="hover:text-primary transition-colors font-medium">Home</a>
                <a href="shop.html" class="hover:text-primary transition-colors font-medium">Shop</a>
                <a href="contact.html" class="hover:text-primary transition-colors font-medium">Contact</a>
            </div>
            <div class="flex items-center gap-6">
                <a href="cart.html" class="relative hover:text-primary transition-colors group">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="8" cy="21" r="1" />
                        <circle cx="19" cy="21" r="1" />
                        <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
                    </svg>
                    <span id="cart-count"
                        class="absolute -top-2 -right-2 bg-primary text-white text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full opacity-0 scale-0 transition-all duration-300 group-hover:scale-110">0</span>
                </a>
                <button id="mobile-menu-btn" class="md:hidden text-white hover:text-primary"><svg
                        xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg></button>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div id="mobile-menu"
            class="hidden md:hidden glass-panel border-b border-white/5 absolute w-full top-full left-0 bg-darker">
            <div class="container mx-auto px-6 py-4 flex flex-col gap-4">
                <a href="index.html" class="block w-full py-2 hover:text-primary">Home</a>
                <a href="shop.html" class="block w-full py-2 hover:text-primary">Shop</a>
                <a href="contact.html" class="block w-full py-2 hover:text-primary">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Product Content -->
    <section class="pt-32 pb-24 min-h-screen flex items-center">
        <div class="container mx-auto px-6">
            <!-- Back Link -->
            <a href="shop.html"
                class="inline-flex items-center gap-2 text-slate-400 hover:text-white mb-8 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6" />
                </svg>
                Back to Shop
            </a>

            <!-- Dynamic Content (Populated by main.js) -->
            <div id="product-detail-container">
                <div class="flex justify-center items-center h-64">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-12 border-t border-white/5 bg-darker">
        <div class="container mx-auto px-6 text-center text-slate-500 text-sm">
            <p>&copy; 2024 Supiri Store. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="assets/js/items.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
